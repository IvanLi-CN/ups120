version: 2
updates:
  # Rust dependencies for main project
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "00:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "ivanli2048"
    assignees:
      - "ivanli2048"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"



  # Node.js dependencies for development tools
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "03:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "ivanli2048"
    assignees:
      - "ivanli2048"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "nodejs"
      - "dev-tools"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "ivanli2048"
    assignees:
      - "ivanli2048"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
