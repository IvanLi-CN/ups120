name: Documentation

on:
  push:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'src/**/*.rs'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'src/**/*.rs'
      - '.github/workflows/docs.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}

      - name: Generate documentation
        run: |
          # Generate main project docs
          cargo doc --target thumbv6m-none-eabi --no-deps --document-private-items

      - name: Check documentation warnings
        run: |
          # Check for documentation warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --target thumbv6m-none-eabi --no-deps --document-private-items

      - name: Upload documentation
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: target/doc/

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Lint markdown files
        run: |
          markdownlint README.md docs/**/*.md --config .markdownlint.json || true

  link-check:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install markdown-link-check
        run: npm install -g markdown-link-check

      - name: Check links in README
        run: markdown-link-check README.md --config .markdown-link-check.json || true

      - name: Check links in docs
        run: |
          find docs -name "*.md" -exec markdown-link-check {} --config .markdown-link-check.json \; || true

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install cspell
        run: npm install -g cspell

      - name: Spell check documentation
        run: |
          cspell "README.md" "docs/**/*.md" --config .cspell.json || true

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: [docs, markdown-lint, link-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi

      - name: Generate documentation
        run: |
          cargo doc --target thumbv6m-none-eabi --no-deps --document-private-items
          
          # Create index.html for GitHub Pages
          cat > target/doc/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <meta charset="utf-8">
              <title>UPS120 RP2040 Documentation</title>
              <meta http-equiv="refresh" content="0; url=ups120/index.html">
          </head>
          <body>
              <p>Redirecting to <a href="ups120/index.html">UPS120 documentation</a>...</p>
          </body>
          </html>
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
