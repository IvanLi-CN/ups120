pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.{rs}"
      run: cargo fmt
      stage_fixed: true
    clippy:
      glob: "*.{rs}"
      run: cargo clippy -- -D warnings
    check:
      glob: "*.{rs}"
      run: cargo check

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
