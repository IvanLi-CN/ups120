[package]
name = "rp2040-embassy-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { git = "https://github.com/IvanLi-CN/embassy", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { git = "https://github.com/IvanLi-CN/embassy", features = ["defmt"] }
embassy-rp = { git = "https://github.com/IvanLi-CN/embassy", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = { git = "https://github.com/IvanLi-CN/embassy" }

cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false

# do not optimize proc-macro crates = faster builds from scratch
[profile.dev.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false

[profile.release.build-override]
codegen-units = 8
debug = false
debug-assertions = false
opt-level = 0
overflow-checks = false
