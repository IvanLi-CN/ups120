[package]
name = "smart-battery"
version = "0.1.0"
edition = "2024"
authors = ["Ivan Li<ivanli2048@gmail.com>"]


[features]
default = []
ship-mode = []

[dependencies]
embassy-stm32 = { path = "../../embassy/embassy-stm32", features = [
  "defmt",
  "time-driver-any",
  "stm32l051c8",
  "memory-x",
] }
embassy-executor = { path = "../../embassy/embassy-executor", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { path = "../../embassy/embassy-time", features = [
  "defmt",
  "tick-hz-1_000",
] }
defmt = "1.0.1"
defmt-rtt = { version = "1.0.0", features = ["disable-blocking-mode"] }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = "0.7.16"

[[bin]]
name = "smart-battery"
path = "src/main.rs"
test = false

[profile.dev]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
panic = 'abort'

[profile.release]
codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
panic = 'abort'
