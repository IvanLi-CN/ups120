[[bin]]
name = "smart-battery-driver-stm32g0-demo"
path = "src/main.rs"

[package]
name = "smart-battery-driver-stm32g0-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { path = "../../../../embassy/embassy-stm32", features = [
  "time-driver-any",
  "stm32g031c8",
  "memory-x",
  "unstable-pac",
  "exti",
  "defmt",
] }
embassy-executor = { path = "../../../../embassy/embassy-executor", features = [
  "arch-cortex-m",
  "executor-thread",
  "defmt",
] }
embassy-time = { path = "../../../../embassy/embassy-time", features = ["defmt","defmt-timestamp-uptime","tick-hz-32_768"] }
embassy-embedded-hal = { path = "../../../../embassy/embassy-embedded-hal" }
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features=["print-defmt"] }
embedded-hal = "1.0.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
smart-battery-driver = { path = "../..", features=["async","defmt"] }
heapless = { version = "0.8", default-features = false }

[profile.dev]
debug = true

[profile.release]
debug = 2
lto = "thin"
opt-level = "z"
panic = "abort"

[features]
default = []
# Build with `--features i2c-400k` to switch the I2C bus to 400 kHz
i2c-400k = []
