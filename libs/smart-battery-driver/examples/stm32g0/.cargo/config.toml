[target.'cfg(all(target_arch = "arm", target_os = "none"))']
# Runner is provided by the root Makefile via `probe-rs run --chip $(CHIP)`.
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=--nmagic",
]

## no per-table runner section; runner specified above is sufficient

[build]
target = "thumbv6m-none-eabi"    # Cortex-M0+

[env]
DEFMT_LOG = "info"

